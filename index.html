/* ---------------- HUD ---------------- */
let hudDirty = true;
let hudLast = 0;
let hudCache = { p1: '', best: '', wave: '' };

function markHUDDirty() { hudDirty = true; }

function weaponBtnHTML(i, p) {
  const w = WEAPONS[i];
  const sel = p && p.weaponIdx === i;
  const state = sel ? (p.reloading ? '换弹' : p.ammo + '/' + w.mag) : w.name;
  return '<span class="wico">' + w.icon + '</span><span class="wkey">' + (i + 1) + '</span><span class="wnm">' + state + '</span>';
}

function updateHUD(force) {
  const t = nowSec();
  if (!force && (!hudDirty || t - hudLast < 0.06)) return;
  hudDirty = false;
  hudLast = t;

  const p0 = players[0];
  const s1 = p0 ? ('❤️' + Math.round(p0.hp) + '  ' + WEAPONS[p0.weaponIdx].icon + (p0.reloading ? '换弹' : p0.ammo) + (p0.boost > 0 ? '  ⚡' : '')) : '';
  if (s1 !== hudCache.p1) { $('stat1').textContent = s1; hudCache.p1 = s1; }
  const hp1 = p0 ? clamp(p0.hp / p0.maxHp * 100, 0, 100) + '%' : '0%';
  $('hp1').style.width = hp1;

  const bestTxt = '🏆 ' + bestS;
  if (bestTxt !== hudCache.best) { $('best').textContent = bestTxt; hudCache.best = bestTxt; }

  const waveTxt = '第 ' + Math.max(1, G.wave) + ' 波　' + (G.combo > 1 ? '连杀 ×' + G.combo : '威胁 ' + (enemies.length + G.waveList.length));
  if (waveTxt !== hudCache.wave) { $('wave-label').textContent = waveTxt; hudCache.wave = waveTxt; }

  /* 冲刺冷却 */
  const cd = players[0] ? clamp(1 - players[0].dashCd / 1.7, 0, 1) : 1;
  const dashEl = $('dash-cd');
  if (dashEl) dashEl.style.height = Math.round((1 - cd) * 100) + '%';
  const dashWrap = $('dash');
  if (dashWrap) dashWrap.classList.toggle('ready', cd >= 1);

  /* 武器按钮 */
  const btns = document.querySelectorAll('.wbtn');
  for (let i = 0; i < btns.length && i < WEAPONS.length; i++) {
    const b = btns[i];
    const sel = p0 && p0.weaponIdx === i;
    if (b.classList.contains('sel') !== !!sel) b.classList.toggle('sel', !!sel);
    const html = weaponBtnHTML(i, p0);
    if (b.dataset.html !== html) { b.innerHTML = html; b.dataset.html = html; }
  }
}

function buildWeaponUI() {
  const cont = $('weapons');
  cont.innerHTML = '';
  WEAPONS.forEach((w, i) => {
    const b = document.createElement('button');
    b.className = 'wbtn';
    b.type = 'button';
    b.innerHTML = weaponBtnHTML(i, null);
    b.addEventListener('click', (e) => { e.preventDefault(); if (players[0]) switchWeapon(players[0], i); });
    cont.appendChild(b);
  });
  hudCache = { p1: '', best: '', wave: '' };
  hudDirty = true;
}

function switchWeapon(p, i) {
  if (!playerAlive(p) || i === p.weaponIdx || p.reloading) return;
  p.weaponIdx = i;
  p.ammo = WEAPONS[i].mag;
  p.nextShot = 0;
  Sound.swap();
  markHUDDirty();
}

/* ---------------- 小地图 ---------------- */
const mm = { c: null, cx: null, w: 172, h: 122, acc: 0 };
function initMinimap() {
  mm.c = $('minimap');
  if (!mm.c) return;
  /* 小屏用更小尺寸，避免遮挡战场 */
  const small = Math.min(window.innerWidth, window.innerHeight) < 560;
  mm.w = small ? 126 : 172;
  mm.h = Math.round(mm.w * (WORLD_H / WORLD_W));
  mm.cx = mm.c.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  mm.c.width = mm.w * dpr;
  mm.c.height = mm.h * dpr;
  mm.c.style.width = mm.w + 'px';
  mm.c.style.height = mm.h + 'px';
  mm.cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function drawMinimap(force) {
  if (!mm.cx) return;
  if (!stats.minimap && !force) return;
  const sx = mm.w / WORLD_W, sy = mm.h / WORLD_H;
  const c = mm.cx;
  c.clearRect(0, 0, mm.w, mm.h);
  c.fillStyle = 'rgba(12,18,12,0.82)';
  c.fillRect(0, 0, mm.w, mm.h);

  c.fillStyle = 'rgba(150,150,120,0.35)';
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    c.fillRect(o.x * sx, o.y * sy, Math.max(1.5, o.w * sx), Math.max(1.5, o.h * sy));
  }
  c.fillStyle = '#8fe08a';
  for (let i = 0; i < pickups.length; i++) c.fillRect(pickups[i].x * sx - 1, pickups[i].y * sy - 1, 2.6, 2.6);

  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    c.fillStyle = e.elite ? '#ff4de0' : '#ff5b4a';
    const s = e.elite ? 5 : 3;
    c.fillRect(e.x * sx - s / 2, e.y * sy - s / 2, s, s);
  }
  for (const p of players) {
    if (!playerAlive(p)) continue;
    c.fillStyle = p.color;
    c.beginPath(); c.arc(p.x * sx, p.y * sy, 3.4, 0, TAU); c.fill();
  }
  if (typeof remotePlayer !== 'undefined' && remotePlayer) {
    c.fillStyle = '#ffd23f';
    c.beginPath(); c.arc(remotePlayer.x * sx, remotePlayer.y * sy, 3, 0, TAU); c.fill();
  }

  c.strokeStyle = 'rgba(255,255,255,0.5)';
  c.lineWidth = 1;
  c.strokeRect(view.left * sx, view.top * sy, view.viewW * sx, view.viewH * sy);
  c.strokeStyle = 'rgba(127,214,107,0.5)';
  c.strokeRect(0.5, 0.5, mm.w - 1, mm.h - 1);
}

let mouseDown = false;
let joyFire = false;
const keys = {};

/* 双人同屏已移除：只剩一名玩家，WASD 与方向键都归 P1，方便单手操作 */
function keyboardMove() {
  const p = players[0];
  if (!p) return;
  let x = 0, y = 0;
  if (keys['a'] || keys['arrowleft']) x -= 1;
  if (keys['d'] || keys['arrowright']) x += 1;
  if (keys['w'] || keys['arrowup']) y -= 1;
  if (keys['s'] || keys['arrowdown']) y += 1;
  p.moveX = x;
  p.moveY = y;
}

function updateShootingFlags() {
  const p0 = players[0];
  if (p0) p0.shooting = mouseDown || joyFire || !!keys[' '];
}

/* 手动瞄准优先级：右侧拖动瞄准后短时间内不自动锁定 */
let aimManual = 0;

function updateAim() {
  const p0 = players[0];
  if (!p0) return;
  if (aimManual > 0) return;
  /* 空格 / 摇杆射击 时自动锁定最近敌人（手感更友好） */
  if (keys[' '] || joyFire) {
    const e = nearestTo(p0.x, p0.y);
    if (e) p0.aim = { x: e.x - p0.x, y: e.y - p0.y };
  }
}
function nearestTo(x, y) {
  let best = null, bd = Infinity;
  for (const e of enemies) {
    if (e.spawnT < e.spawnDur) continue;
    const d = dist2(x, y, e.x, e.y);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'tab') e.preventDefault();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].indexOf(k) >= 0) e.preventDefault();
  if (keys[k]) return;
  keys[k] = true;

  if (k === 'p' || k === 'escape') { togglePause(); return; }
  if (k === 'm') {
    const m = Sound.toggleMute();
    if (!m && G.running) Sound.startMusic();
    tipFlash(m ? '🔇 已静音' : '🔊 音效开启');
    if (m) Sound.stopMusic();
    return;
  }
  if (k === 'tab') {
    stats.minimap = !stats.minimap; persistStats();
    $('minimap').style.display = stats.minimap && G.running ? 'block' : 'none';
    tipFlash(stats.minimap ? '小地图开' : '小地图关');
    return;
  }
  if (k === 'u') {
    stats.shake = !stats.shake; persistStats();
    tipFlash(stats.shake ? '震屏开' : '震屏关');
    return;
  }
  if (!G.running || G.paused) return;
  if (k >= '1' && k <= '5') switchWeapon(players[0], +k - 1);
  if (k === 'r') startReload(players[0]);
  if (k === 'shift') tryDash(players[0]);
});

  const k = e.key.toLowerCase();
  keys[k] = false;
  if (k === 'shift') keys['shift'] = false;
});
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;

/* ---------------- 触屏操作（对齐 和平精英 / 三角洲 的手感）----------------
 * · 左半屏任意位置按下即生成摇杆底座（跟随式），松手回到默认提示位
 * · 半径随屏幕自适应，死区小、到 85% 半径即满速，微推也能精细走位
 * · 右半屏拖动 = 瞄准（类似手游的"看"），松手后短暂保持手动瞄准
 */
const joystick = $('joystick');
const knob = $('knob');
const fireBtn = $('fire');
const dashBtn = $('dash');

const joy = { active: false, id: null, bx: 0, by: 0, kx: 0, ky: 0, r: 60 };
let aimId = null;

function joyRadius() {
  return clamp(Math.min(view.cssW, view.cssH) * 0.17, 44, 92);
}
function joyDead() { return Math.max(5, joy.r * 0.10); }

function joyDefaultPos() {
  return { x: 26 + joy.r, y: view.cssH - 26 - joy.r };
}
function placeJoystick(bx, by) {
  joy.bx = clamp(bx, joy.r * 0.6, view.cssW - joy.r * 0.6);
  joy.by = clamp(by, joy.r * 0.6, view.cssH - joy.r * 0.6);
  joystick.style.width = (joy.r * 2) + 'px';
  joystick.style.height = (joy.r * 2) + 'px';
  joystick.style.left = joy.bx + 'px';
  joystick.style.top = joy.by + 'px';
  joystick.style.opacity = '1';
  const ks = Math.round(joy.r * 0.88);
  knob.style.width = ks + 'px';
  knob.style.height = ks + 'px';
}
function parkJoystick() {
  joy.active = false;
  joy.id = null;
  joy.r = joyRadius();
  const d = joyDefaultPos();
  placeJoystick(d.x, d.y);
  joystick.style.opacity = '0.42';
  knob.style.transform = 'translate(-50%,-50%)';
  if (players[0]) { players[0].joyX = 0; players[0].joyY = 0; }
}
function updateKnob(dx, dy) {
  let ux = dx, uy = dy;
  const d = Math.hypot(ux, uy);
  if (d > joy.r) { ux = ux / d * joy.r; uy = uy / d * joy.r; }
  joy.kx = ux; joy.ky = uy;
  knob.style.transform = 'translate(calc(-50% + ' + ux + 'px), calc(-50% + ' + uy + 'px))';

  /* 死区 + 平滑曲线：85% 半径即达满速 */
  const dd = Math.hypot(ux, uy);
  const dead = joyDead();
  let mag = 0;
  if (dd > dead) {
    mag = clamp((dd - dead) / (joy.r - dead) / 0.85, 0, 1);
    mag = mag * mag * (3 - 2 * mag);          // smoothstep，起步更跟手
  }
  if (mag > 0.001) {
    const v = toGameVec(ux / (dd || 1), uy / (dd || 1));
    if (players[0]) { players[0].joyX = v.x * mag; players[0].joyY = v.y * mag; }
  } else if (players[0]) {
    players[0].joyX = 0; players[0].joyY = 0;
  }
}

function aimAtWorld(clientX, clientY) {
  const p = players[0];
  if (!p || !playerAlive(p)) return;
  const w = screenToWorld(clientX, clientY);
  p.aim = { x: w.x - p.x, y: w.y - p.y };
  aimManual = 2.5;
}

function onTouchStart(e) {
  if (!G.running || G.paused) return;
  for (const t of e.changedTouches) {
    const p = screenToCanvas(t.clientX, t.clientY);
    if (p.x <= view.cssW * 0.46 && !joy.active) {
      joy.active = true;
      joy.id = t.identifier;
      joy.r = joyRadius();
      placeJoystick(p.x, p.y);
      updateKnob(0, 0);
    } else if (p.x > view.cssW * 0.46 && aimId === null) {
      aimId = t.identifier;
      aimAtWorld(t.clientX, t.clientY);
    }
  }
  e.preventDefault();
}
function onTouchMove(e) {
  if (!G.running) return;
  for (const t of e.changedTouches) {
    if (joy.active && t.identifier === joy.id) {
      const p = screenToCanvas(t.clientX, t.clientY);
      updateKnob(p.x - joy.bx, p.y - joy.by);
    } else if (t.identifier === aimId) {
      aimAtWorld(t.clientX, t.clientY);
    }
  }
  e.preventDefault();
}
function onTouchEnd(e) {
  for (const t of e.changedTouches) {
    if (joy.active && t.identifier === joy.id) parkJoystick();
    if (t.identifier === aimId) aimId = null;
  }
}
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
canvas.addEventListener('touchmove', onTouchMove, { passive: false });
canvas.addEventListener('touchend', onTouchEnd, { passive: false });
canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });

/* 桌面鼠标：左键按住射击并瞄准 */

});

      ta.value = url;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, url.length);
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) { ok = false; }
    if (ok) {
      tip.textContent = '✅ 已复制到剪贴板，粘贴到浏览器即可打开';
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url)
        .then(() => { tip.textContent = '✅ 已复制到剪贴板'; })
        .catch(() => { tip.textContent = '复制未成功，请长按上方地址手动复制'; });
    } else {
      tip.textContent = '复制未成功，请长按上方地址手动复制';
    }
  });
}

/* ---------------- PWA：Service Worker（离线可玩） ---------------- */
function setupPWA() {
  if (!('serviceWorker' in navigator)) return;
  /* 原生壳（Capacitor）里没有 SW，直接跳过 */
  if (window.Capacitor || window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge) return;
  const httpLike = location.protocol === 'https:' ||
    (location.protocol === 'http:' && (location.hostname === 'localhost' || location.hostname === '127.0.0.1'));
  if (!httpLike) return;
  /* 同目录 sw.js 由构建产出；注册失败（如只上传了 index.html）不影响游戏 */
  navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => { /* 忽略 */ });
}

/* ---------------- 联机（PeerJS 可选增强） ---------------- */
let netMode = 'single';
let peer = null, conn = null;
let remotePlayer = null;
let netTimer = null;

function peerAvailable() { return typeof Peer !== 'undefined' && Peer; }

function spawnRemotePlayer(color, hair, vest) {
  remotePlayer = { x: WORLD_W / 2 + 60, y: WORLD_H / 2 + 60, angle: 0, color, hair, vest, r: PLAYER_R };
}
function destroyNet() {
  if (netTimer) { clearInterval(netTimer); netTimer = null; }
  if (conn) { try { conn.close(); } catch (e) { /* 忽略 */ } conn = null; }
  if (peer) { try { peer.destroy(); } catch (e) { /* 忽略 */ } peer = null; }
  remotePlayer = null;
}
function sendState() {
  if (conn && conn.open && players[0]) {
    conn.send({ type: 'state', x: players[0].x, y: players[0].y, angle: Math.atan2(players[0].aim.y, players[0].aim.x), walk: players[0].walkT });
  }
}
function broadcastWorld() {
  if (!conn || !conn.open || netMode !== 'host') return;
  const list = enemies.map(e => ({ id: e.id, x: e.x, y: e.y, angle: e.angle, hp: e.hp, maxHp: e.maxHp, r: e.r, body: e.body, elite: e.elite, spawnT: e.spawnT, spawnDur: e.spawnDur }));
  const p = players[0];
  conn.send({
    type: 'world', enemies: list, score: G.score, wave: G.wave, combo: G.combo,
    hostX: p ? p.x : 0, hostY: p ? p.y : 0, hostAngle: p ? Math.atan2(p.aim.y, p.aim.x) : 0, hostWalk: p ? p.walkT : 0,
  });
}
function syncEnemies(list) {
  const ids = new Set(list.map(e => e.id));
  for (let i = enemies.length - 1; i >= 0; i--) if (!ids.has(enemies[i].id)) enemies.splice(i, 1);
  for (const d of list) {
    let e = enemies.find(x => x.id === d.id);
    if (!e) {
      e = { id: d.id, kind: d.elite ? 'elite' : 'grunt', x: d.x, y: d.y, r: d.r, hp: d.hp, maxHp: d.maxHp || d.hp, speed: 0, score: 10, body: d.body, hair: '#3a2515', ranged: false, elite: !!d.elite, angle: d.angle, walkT: 0, flash: 0, spawnT: d.spawnT || 1, spawnDur: d.spawnDur || 0.5, fireT: 99, wobble: 0 };
      enemies.push(e);
    } else {
      e.x = d.x; e.y = d.y; e.angle = d.angle; e.hp = d.hp; e.maxHp = d.maxHp || e.maxHp; e.r = d.r; e.body = d.body; e.elite = !!d.elite;
      e.spawnT = d.spawnT === undefined ? 1 : d.spawnT;
    }
  }
}
function guestShoot(d) {
  const w = WEAPONS[d.weaponIdx] || WEAPONS[0];
  const base = d.angle;
  for (let i = 0; i < (d.pellets || 1); i++) {
    const spread = (d.pellets || 1) > 1 ? (d.spread || 0.2) * 2 : (d.spread || 0);
    const ang = base + (Math.random() - 0.5) * spread;
    bullets.push({
      x: d.x + Math.cos(ang) * 22, y: d.y + Math.sin(ang) * 22,
      vx: Math.cos(ang) * w.speed, vy: Math.sin(ang) * w.speed,
      dmg: d.dmg, pierce: 0, life: 1.35, from: -1, big: false,
    });
  }
  addParticles(d.x + Math.cos(base) * 20, d.y + Math.sin(base) * 20, '#ffd166', 3, 0.6);
}
function onMessage(data) {
  if (!data || !data.type) return;
  if (data.type === 'state' && remotePlayer) {
    remotePlayer.x = data.x; remotePlayer.y = data.y; remotePlayer.angle = data.angle; remotePlayer.walk = data.walk || 0;
  } else if (data.type === 'world') {
    syncEnemies(data.enemies || []);
    if (typeof data.score === 'number') G.score = data.score;
    if (typeof data.wave === 'number') G.wave = data.wave;
    if (typeof data.combo === 'number') G.combo = data.combo;
    if (remotePlayer) { remotePlayer.x = data.hostX; remotePlayer.y = data.hostY; remotePlayer.angle = data.hostAngle; remotePlayer.walk = data.hostWalk || 0; }
    markHUDDirty();
  } else if (data.type === 'shoot') {
    guestShoot(data);
  }
}
function startNetLoop() {
  if (netTimer) clearInterval(netTimer);
  netTimer = setInterval(() => {
    if (!G.running || G.paused) return;
    if (netMode === 'host') broadcastWorld();
    else if (netMode === 'guest') sendState();
  }, 50);
}
function createRoom() {
  const info = $('room-info');
  info.style.display = 'block';
  if (!peerAvailable()) {
    info.textContent = '联机组件未能加载（需要联网加载 PeerJS）。可先用「双人同屏」游玩。';
    return;
  }
  destroyNet();
  netMode = 'host';
  info.textContent = '正在创建房间…';
  try {
    peer = new Peer();
    peer.on('open', (id) => { info.textContent = '房间码：' + id + '（发给朋友加入）'; });
    peer.on('connection', (c) => {
      conn = c;
      conn.on('open', () => { startGame('single'); spawnRemotePlayer('#5cd36b', '#1b2a18', '#2f5b34'); startNetLoop(); });
      conn.on('data', onMessage);
      conn.on('close', () => { tipFlash('对方已离开'); destroyNet(); showMenu(); });
    });
    peer.on('error', (err) => { info.textContent = '创建失败：' + ((err && err.type) || err); });
  } catch (err) {
    info.textContent = '创建失败：' + err;
  }
}
function joinRoom(code) {
  const info = $('room-info');
  info.style.display = 'block';
  if (!peerAvailable()) {
    info.textContent = '联机组件未能加载（需要联网加载 PeerJS）。可先用「双人同屏」游玩。';
    return;
  }
  destroyNet();
  netMode = 'guest';
  info.textContent = '正在连接…';
  try {
    peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect(code, { reliable: true });
      conn.on('open', () => { startGame('single'); spawnRemotePlayer('#4da6ff', '#2f2114', '#2b4a73'); startNetLoop(); });
      conn.on('data', onMessage);
      conn.on('close', () => { tipFlash('连接已断开'); destroyNet(); showMenu(); });
    });
    peer.on('error', (err) => { info.textContent = '连接失败：' + ((err && err.type) || err) + '（请检查房间码）'; });
  } catch (err) {
    info.textContent = '连接失败：' + err;
  }
}

/* ---------------- 主循环 ---------------- */
let rafId = 0;
let lastT = 0;

function loop(nowMs) {
  rafId = requestAnimationFrame(loop);
  if (!lastT) lastT = nowMs;
  let dt = (nowMs - lastT) / 1000;
  lastT = nowMs;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(0.05, dt);

  if (aimManual > 0) aimManual -= dt;

  if (G.running && !G.paused) {
    updateShootingFlags();
    keyboardMove();
    updateAim();
    updateGame(dt);
    if (netMode === 'guest' && typeof onGuestTick === 'function') onGuestTick(dt);
  } else if (!G.running) {
    /* 菜单背景：缓慢平移的战场 */
    G.time += dt;
    view.camX = WORLD_W / 2 + Math.sin(G.time * 0.13) * 190;
    view.camY = WORLD_H / 2 + Math.cos(G.time * 0.10) * 130;
    clampCamera();
    updateFx(dt);
  }

  draw();
  updateHUD();
  drawMinimap();
}

function onGuestTick(dt) {
  /* 客机也需要把本地子弹/特效推进，但敌人由主机同步 */
}

/* ---------------- 启动 ---------------- */
function boot() {
  loadSave();
  resize();
  initMinimap();
  buildWeaponUI();
  resetWorld();

  if (stats.difficulty && DIFFICULTIES[stats.difficulty]) difficulty = stats.difficulty;
  else difficulty = 'hard';

  /* 先生成贴图（菜单期间完成），保证进游戏时地表已就绪 */
  buildTextures(() => { ensureDecalSprites(); });

  /* PWA 装配放到空闲时，不阻塞开局 */
  /* 单文件构建：无 Service Worker */

  /* 菜单按钮 */
  $('btn-easy').addEventListener('click', () => { difficulty = 'easy'; stats.difficulty = 'easy'; persistStats(); highlightDifficulty(); });
  $('btn-hard').addEventListener('click', () => { difficulty = 'hard'; stats.difficulty = 'hard'; persistStats(); highlightDifficulty(); });
  $('btn-hell').addEventListener('click', () => { difficulty = 'hell'; stats.difficulty = 'hell'; persistStats(); highlightDifficulty(); });

  $('btn-single').addEventListener('click', () => { destroyNet(); netMode = 'single'; startGame('single'); });
  $('btn-menu').addEventListener('click', () => { destroyNet(); netMode = 'single'; showMenu(); });
  $('btn-host').addEventListener('click', createRoom);
  $('btn-join').addEventListener('click', () => {
    const code = $('room-input').value.trim();
    if (code) joinRoom(code); else tipFlash('请输入房间码');
  });
  $('btn-back').addEventListener('click', () => {
    G.running = false; G.paused = false;
    Sound.stopMusic();
    destroyNet(); netMode = 'single';
    $('pause-overlay').style.display = 'none';
    showMenu();
  });
  $('btn-resume').addEventListener('click', () => { if (G.paused) togglePause(); });

  /* 平台安装提示 */
  (function () {
    const ua = navigator.userAgent;
    const steps = $('ig-steps');
    if (isWeChat()) {
      steps.innerHTML = '微信内点右上角 <b>···</b> → <b>在浏览器中打开</b> → 再「添加到主屏幕」';
    } else if (/iPhone|iPad|iPod/.test(ua)) {
      steps.innerHTML = '点 <b>分享</b> → <b>添加到主屏幕</b> → <b>添加</b>';
    } else if (/Android/.test(ua)) {
      steps.innerHTML = '点 <b>⋮</b> → <b>添加到主屏幕</b> → <b>安装</b>';
    } else {
      steps.innerHTML = '地址栏点 <b>安装</b> 图标，或 Ctrl+D 收藏';
    }
  })();

  setupWechatGuide();
  showMenu();
  lastT = performance.now();
  rafId = requestAnimationFrame(loop);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
