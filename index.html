<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    background:#0a0f14; color:#e6edf3; overflow:hidden; height:100%;
    font-family:-apple-system,"PingFang SC",sans-serif; user-select:none;
    -webkit-tap-highlight-color:transparent; touch-action:none; position:fixed; inset:0;
  }
  #wrap { position:relative; width:100vw; height:100vh; }
  canvas { position:absolute; top:0; left:0; display:block; }
  @media (orientation: portrait) {
    #wrap { width:100vh; height:100vw; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) rotate(90deg); }
  }

  /* 准星 */
  #crosshair {
    position:absolute; top:50%; left:50%; width:26px; height:26px;
    transform:translate(-50%,-50%); pointer-events:none; z-index:4;
  }
  #crosshair::before, #crosshair::after {
    content:''; position:absolute; background:rgba(255,255,255,.9);
  }
  #crosshair::before { left:50%; top:0; width:2px; height:100%; transform:translateX(-50%); }
  #crosshair::after { top:50%; left:0; height:2px; width:100%; transform:translateY(-50%); }
  #crosshair .dot { position:absolute; top:50%; left:50%; width:4px; height:4px; background:#ff5555; border-radius:50%; transform:translate(-50%,-50%); }

  #hud {
    position:absolute; top:0; left:0; right:0; padding:10px 16px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; z-index:5; gap:8px;
  }
  .phud { flex:1; min-width:0; }
  .hpbar { height:10px; background:rgba(0,0,0,.5); border-radius:5px; overflow:hidden; margin:3px 0; }
  .hpbar > div { height:100%; border-radius:5px; transition:width .15s; background:#4da6ff; }
  .pstat { font-size:13px; color:#d8dee5; font-weight:bold; }
  #center { text-align:center; }
  #best { font-size:13px; color:#ffd23f; }
  #mode-label { font-size:11px; color:#8b949e; }
  #reload-tip {
    position:absolute; top:22%; left:50%; transform:translateX(-50%);
    font-size:15px; color:#ffd23f; font-weight:bold; z-index:5; pointer-events:none; display:none;
  }

  #weapons {
    position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; z-index:5; flex-wrap:wrap; justify-content:center; padding:0 10px;
  }
  .wbtn {
    background:rgba(20,26,32,.92); border:2px solid #3a443a; border-radius:10px;
    color:#e6edf3; padding:6px 9px; min-width:52px; cursor:pointer; text-align:center; font-size:11px;
  }
  .wbtn .wico { font-size:18px; display:block; }
  .wbtn.sel { border-color:#4da6ff; background:rgba(38,64,96,.55); }
  .wbtn .wkey { font-size:9px; color:#8b949e; display:block; }
  .wbtn:active { transform:scale(.93); }

  #joystick {
    position:absolute; bottom:22px; left:22px; width:120px; height:120px;
    border-radius:50%; background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.28);
    z-index:6; touch-action:none;
  }
  #joystick .knob {
    position:absolute; top:50%; left:50%; width:50px; height:50px;
    transform:translate(-50%,-50%); border-radius:50%;
    background:rgba(255,255,255,.4); border:2px solid rgba(255,255,255,.6); pointer-events:none;
  }
  #fire {
    position:absolute; bottom:28px; right:26px; width:92px; height:92px;
    border-radius:50%; background:rgba(235,80,55,.8); border:3px solid rgba(255,255,255,.5);
    z-index:6; color:#fff; font-weight:bold; font-size:16px;
    display:flex; align-items:center; justify-content:center; flex-direction:column; touch-action:none;
  }
  #fire .f-ic { font-size:24px; line-height:1; }
  #fire .f-tx { font-size:11px; }
  #fire:active { background:rgba(235,80,55,1); transform:scale(.94); }

  #overlay {
    position:absolute; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center; background:rgba(8,12,16,.94); padding:20px;
  }
  #overlay h1 { font-size:28px; color:#7fd66b; }
  #overlay .sub { font-size:13px; color:#8b949e; line-height:1.6; max-width:520px; }
  #overlay .best { font-size:14px; color:#ffd23f; }
  .btn { background:#2a7d3b; color:#fff; border:none; padding:12px 28px; font-size:16px; border-radius:9px; cursor:pointer; font-weight:bold; min-width:170px; }
  .btn.alt { background:#3a443a; }
  .btn:active { transform:scale(.95); }
  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .tip { font-size:11px; color:#6e7681; line-height:1.8; max-width:600px; }
  #room-input {
    background:rgba(255,255,255,.08); border:2px solid #3a443a; border-radius:9px;
    color:#e6edf3; padding:11px 14px; font-size:15px; width:190px; outline:none; text-align:center;
  }
  #room-input:focus { border-color:#4da6ff; }
  #room-info { font-size:16px; color:#ffd23f; font-weight:bold; word-break:break-all; }

<script type="module">
import * as THREE from 'three';
// ===== 音频引擎 =====
let actx = null;
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
let noiseBuf = null;
function getNoise() {
  if (noiseBuf) return noiseBuf;
  const a = audio();
  noiseBuf = a.createBuffer(1, a.sampleRate * 0.5, a.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}
function burst(dur, vol, freq, type, slideTo) {
  const a = audio();
  const src = a.createBufferSource();
  src.buffer = getNoise();
  const f = a.createBiquadFilter();
  f.type = type || 'bandpass';
  f.frequency.value = freq || 800;
  f.Q.value = 1;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  src.connect(f).connect(g).connect(a.destination);
  src.start(); src.stop(a.currentTime + dur);
  if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
}
function tone(freq, dur, vol, type, slideTo) {
  const a = audio();
  const o = a.createOscillator();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, a.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
const sfx = {
  pistol() { burst(0.08, 0.5, 1800, 'highpass', 600); },
  shotgun() { burst(0.18, 0.7, 700, 'lowpass', 200); },
  smg() { burst(0.05, 0.4, 2200, 'highpass', 900); },
  sniper() { burst(0.25, 0.8, 500, 'lowpass', 150); tone(300, 0.2, 0.3, 'sawtooth', 80); },
  minigun() { burst(0.04, 0.35, 2600, 'highpass', 1200); },
  hit() { tone(900, 0.06, 0.25, 'square', 500); },
  kill() { tone(600, 0.12, 0.3, 'square', 200); burst(0.1, 0.4, 1000, 'bandpass', 300); },
  hurt() { tone(200, 0.2, 0.4, 'sawtooth', 90); },
  reload() { tone(500, 0.06, 0.25, 'square'); setTimeout(() => tone(700, 0.06, 0.25, 'square'), 120); },
  switch() { tone(800, 0.05, 0.2, 'square', 1100); },
  gameover() { tone(400, 0.6, 0.4, 'sawtooth', 60); tone(300, 0.8, 0.3, 'triangle', 50); },
};

// ===== 背景音乐(循环战斗氛围) =====
let musicTimer = null, musicOn = false;
function startMusic() {
  if (musicOn) return;
  musicOn = true;
  const a = audio();
  // 低频垫音 drone
  const droneGain = a.createGain();
  droneGain.gain.value = 0.05;
  droneGain.connect(a.destination);
  const o1 = a.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 55;
  const o2 = a.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 55.5;
  const filt = a.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 220;
  o1.connect(filt); o2.connect(filt); filt.connect(droneGain);
  o1.start(); o2.start();
  // 鼓点循环
  let beat = 0;
  musicTimer = setInterval(() => {
    beat++;
    // 底鼓(每拍)
    tone(120, 0.15, 0.18, 'sine', 60);
    // 军鼓(第2、4拍)
    if (beat % 2 === 0) burst(0.1, 0.12, 1800, 'highpass', 400);
    // 高频点缀(每4拍)
    if (beat % 4 === 0) tone(880, 0.08, 0.06, 'triangle', 660);
  }, 500);
}
function stopMusic() {
  musicOn = false;
  if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
}

// ===== 数据(换弹统一 2 秒) =====
const WEAPONS = [
  { name:'P92', icon:'🔫', dmg:1, pellets:1, spread:0.01, rate:0.22, mag:12, reload:2.0, sfx:'pistol' },
  { name:'S686', icon:'💥', dmg:1, pellets:5, spread:0.06, rate:0.75, mag:6, reload:2.0, sfx:'shotgun' },
  { name:'UZI', icon:'⚡', dmg:1, pellets:1, spread:0.02, rate:0.07, mag:32, reload:2.0, sfx:'smg' },
  { name:'AWM', icon:'🎯', dmg:3, pellets:1, spread:0.005, rate:1.1, mag:5, reload:2.0, sfx:'sniper' },
  { name:'DP-28', icon:'🌀', dmg:1, pellets:1, spread:0.025, rate:0.045, mag:60, reload:2.0, sfx:'minigun' },
];
const ENEMY_TYPES = [
  { hp:1, r:0.6, speed:1.7, color:0xe5533d, score:10 },
  { hp:1, r:0.5, speed:3.0, color:0xe8a33d, score:15 },
  { hp:3, r:0.85, speed:1.2, color:0xa06bde, score:30 },
];

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function rand(a, b) { return a + Math.random() * (b - a); }
// ===== 3D 场景 =====
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.getElementById('wrap').prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a5c9);
scene.fog = new THREE.Fog(0x87a5c9, 20, 70);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 1.7, 0);

// 灯光
scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.1);
sun.position.set(20, 30, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
sun.shadow.camera.far = 80;
scene.add(sun);

// 地面
const groundGeo = new THREE.PlaneGeometry(80, 80);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x3a5a2a });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 天空装饰(远处树木/石头简化为箱子)
const worldR = 30; // 玩家活动半径边界

// ===== 掩体 =====
const obstacles = []; // {x, z, w, d, h, mesh}
function genObstacles() {
  for (const o of obstacles) scene.remove(o.mesh);
  obstacles.length = 0;
  const n = 18;
  let placed = 0, tries = 0;
  while (placed < n && tries < 400) {
    tries++;
    const type = Math.random() < 0.5 ? 'crate' : 'wall';
    const w = type === 'crate' ? rand(1.6, 3) : rand(2.5, 5);
    const d = type === 'crate' ? rand(1.6, 3) : rand(1.2, 2);
    const h = type === 'crate' ? rand(1.6, 2.6) : rand(2.2, 3.5);
    const x = rand(-26, 26), z = rand(-26, 26);
    if (Math.hypot(x, z) < 8) continue; // 避开出生点
    let overlap = false;
    for (const o of obstacles) {
      if (Math.abs(x - o.x) < (w + o.w) / 2 + 1.2 && Math.abs(z - o.z) < (d + o.d) / 2 + 1.2) { overlap = true; break; }
    }
    if (overlap) continue;
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshLambertMaterial({ color: type === 'crate' ? 0x8a6a3a : 0x7a7a82 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, h / 2, z);
    mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);
    obstacles.push({ x, z, w, d, h, mesh });
    placed++;
  }
}

// ===== 玩家状态 =====
let yaw = 0, pitch = 0;
let hp = 100, score = 0;
let weaponIdx = 0, ammo = WEAPONS[0].mag;
let reloading = false, reloadEnd = 0, nextShot = 0;
let running = false, keys = {};
let mouseDown = false, joyFire = false;
let joyX = 0, joyY = 0;

function applyView() {
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}

// ===== 碰撞(玩家 vs 掩体，XZ 平面圆 vs AABB) =====
const playerR = 0.6;
function collides(x, z, r) {
  for (const o of obstacles) {
    const nx = clamp(x, o.x - o.w / 2, o.x + o.w / 2);
    const nz = clamp(z, o.z - o.d / 2, o.z + o.d / 2);
    const dx = x - nx, dz = z - nz;
    if (dx * dx + dz * dz < r * r) return true;
  }
  return false;
}
function movePlayer(dx, dz) {
  const nx = camera.position.x + dx;
  if (!collides(nx, camera.position.z, playerR) && Math.abs(nx) < worldR) camera.position.x = nx;
  const nz = camera.position.z + dz;
  if (!collides(camera.position.x, nz, playerR) && Math.abs(nz) < worldR) camera.position.z = nz;
}
// ===== 响应式(强制横屏) =====
function isPortrait() { return window.innerHeight > window.innerWidth; }
function toGameVec(dx, dy) {
  if (isPortrait()) return { x: dy, y: -dx };
  return { x: dx, y: dy };
}
function resize() {
  const W = isPortrait() ? window.innerHeight : window.innerWidth;
  const H = isPortrait() ? window.innerWidth : window.innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ===== 敌人 =====
const enemies = [];
let nextEnemyId = 1;
function spawnEnemy() {
  const tier = Math.random();
  const t = tier < 0.55 ? ENEMY_TYPES[0] : tier < 0.8 ? ENEMY_TYPES[1] : ENEMY_TYPES[2];
  const side = Math.floor(Math.random() * 4), margin = 32;
  let x, z;
  if (side === 0) { x = rand(-margin, margin); z = -margin; }
  else if (side === 1) { x = rand(-margin, margin); z = margin; }
  else if (side === 2) { x = -margin; z = rand(-margin, margin); }
  else { x = margin; z = rand(-margin, margin); }
  const geo = new THREE.BoxGeometry(t.r * 1.3, 1.8, t.r * 1.3);
  const mat = new THREE.MeshLambertMaterial({ color: t.color });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, 0.9, z);
  mesh.castShadow = true;
  scene.add(mesh);
  const enemy = { id: nextEnemyId++, mesh, hp: t.hp, maxHp: t.hp, speed: t.speed, score: t.score, color: t.color, r: t.r, flash: 0, dead: false, baseY: 0.9 };
  mesh.userData.enemy = enemy;
  enemies.push(enemy);
}
function removeEnemy(i) {
  const e = enemies[i];
  scene.remove(e.mesh);
  e.dead = true;
  enemies.splice(i, 1);
}

// ===== 射击 =====
function hitEnemy(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg;
  e.flash = 0.1;
  if (e.hp <= 0) {
    score += e.score;
    sfx.kill();
    const idx = enemies.indexOf(e);
    if (idx >= 0) removeEnemy(idx);
    updateHUD();
  } else {
    sfx.hit();
  }
}
function shoot() {
  const w = WEAPONS[weaponIdx];
  if (!running || reloading) return;
  const now = performance.now() / 1000;
  if (now < nextShot) return;
  if (ammo <= 0) { startReload(); return; }
  ammo--;
  nextShot = now + w.rate;
  sfx[w.sfx]();
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  if (netMode === 'guest') {
    if (conn && conn.open) conn.send({ type: 'shoot', x: camera.position.x, z: camera.position.z, dx: dir.x, dy: dir.y, dz: dir.z, dmg: w.dmg, pellets: w.pellets, spread: w.spread });
  } else {
    for (let i = 0; i < w.pellets; i++) {
      const d = dir.clone();
      if (w.spread > 0) {
        d.x += (Math.random() - 0.5) * w.spread * 2;
        d.y += (Math.random() - 0.5) * w.spread * 2;
        d.z += (Math.random() - 0.5) * w.spread * 2;
        d.normalize();
      }
      const rc = new THREE.Raycaster(camera.position, d, 0, 100);
      const hits = rc.intersectObjects(enemies.map(e => e.mesh), false);
      if (hits.length > 0) {
        const e = hits[0].object.userData.enemy;
        if (e && !e.dead) hitEnemy(e, w.dmg);
      }
    }
  }
  updateHUD();
  if (ammo === 0) startReload();
}
function startReload() {
  if (reloading) return;
  reloading = true;
  reloadEnd = performance.now() / 1000 + WEAPONS[weaponIdx].reload;
  sfx.reload();
}
function switchWeapon(i) {
  if (i === weaponIdx || reloading) return;
  weaponIdx = i;
  ammo = WEAPONS[i].mag;
  nextShot = 0;
  sfx.switch();
  updateHUD();
}

// ===== HUD =====
function updateHUD() {
  document.getElementById('hp1').style.width = hp + '%';
  const w = WEAPONS[weaponIdx];
  document.getElementById('stat1').textContent = '❤️' + Math.round(hp) + ' ' + w.icon + (reloading ? '换弹' : ammo);
  if (score > best) { best = score; localStorage.setItem(BEST_KEY, String(best)); }
  document.getElementById('best').textContent = '🏆 ' + best;
  const btns = document.querySelectorAll('.wbtn');
  btns.forEach((b, i) => {
    b.classList.toggle('sel', i === weaponIdx);
    const ww = WEAPONS[i];
    b.innerHTML = '<span class="wico">' + ww.icon + '</span><span class="wkey">' + (i + 1) + '</span><span>' + (i === weaponIdx ? (reloading ? '换弹' : ammo + '/' + ww.mag) : ww.name) + '</span>';
  });
  const tip = document.getElementById('reload-tip');
  if (reloading) {
    tip.style.display = 'block';
    tip.textContent = '换弹中 ' + Math.max(0, (reloadEnd - performance.now() / 1000)).toFixed(1) + 's';
  } else {
    tip.style.display = 'none';
  }
}
function buildWeaponUI() {
  const cont = document.getElementById('weapons');
  cont.innerHTML = '';
  WEAPONS.forEach((w, i) => {
    const b = document.createElement('button');
    b.className = 'wbtn';
    b.innerHTML = '<span class="wico">' + w.icon + '</span><span class="wkey">' + (i + 1) + '</span><span>' + w.name + '</span>';
    b.addEventListener('click', () => switchWeapon(i));
    cont.appendChild(b);
  });
}
const BEST_KEY = 'shooter3d_best';
let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);

// ===== 伤害 =====
function damagePlayer(amt) {
  if (!running || hp <= 0) return;
  hp -= amt;
  if (hp < 0) hp = 0;
  sfx.hurt();
  updateHUD();
  if (hp <= 0) gameOver();
}

// ===== 更新 =====
let spawnTimer = 1.0;
function update(dt) {
  if (!running) return;
  const now = performance.now() / 1000;

  // 移动(WASD + 摇杆)
  let mx = 0, mz = 0;
  if (keys['w']) mz -= 1;
  if (keys['s']) mz += 1;
  if (keys['a']) mx -= 1;
  if (keys['d']) mx += 1;
  mx += joyX; mz += joyY;
  const ml = Math.hypot(mx, mz);
  if (ml > 1) { mx /= ml; mz /= ml; }
  const speed = 6;
  const cos = Math.cos(yaw), sin = Math.sin(yaw);
  const vx = (mx * cos - mz * sin) * speed * dt;
  const vz = (mx * sin + mz * cos) * speed * dt;
  movePlayer(vx, vz);

  // 换弹
  if (reloading && now >= reloadEnd) {
    reloading = false;
    ammo = WEAPONS[weaponIdx].mag;
    updateHUD();
  }
  // 射击
  if (mouseDown || joyFire || keys[' ']) shoot();

  // 刷怪 + 敌人(仅单机或主机)
  if (netMode !== 'guest') {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy();
      spawnTimer = Math.max(0.3, 0.85 - score * 0.003);
    }

    const t3 = now * 2;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.dead) continue;
      // 目标:最近的玩家(host 或 guest)
      let tx = camera.position.x, tz = camera.position.z, isGuest = false;
      if (netMode === 'host' && remotePlayer) {
        const hd = Math.hypot(camera.position.x - e.mesh.position.x, camera.position.z - e.mesh.position.z);
        const gd = Math.hypot(remotePlayer.x - e.mesh.position.x, remotePlayer.z - e.mesh.position.z);
        if (gd < hd) { tx = remotePlayer.x; tz = remotePlayer.z; isGuest = true; }
      }
      const dx = tx - e.mesh.position.x;
      const dz = tz - e.mesh.position.z;
      const d = Math.hypot(dx, dz) || 1;
      const step = e.speed * dt;
      const nx = e.mesh.position.x + dx / d * step;
      const nz = e.mesh.position.z + dz / d * step;
      if (!collides(nx, nz, e.r)) {
        e.mesh.position.x = nx;
        e.mesh.position.z = nz;
      }
      e.mesh.position.y = e.baseY + Math.sin(t3 + i) * 0.08;
      e.mesh.rotation.y = Math.atan2(dx, dz);
      if (d < e.r + playerR) {
        if (isGuest) { if (conn && conn.open) conn.send({ type: 'damage', amt: 8 + e.r * 6 }); }
        else damagePlayer(8 + e.r * 6);
        removeEnemy(i);
        continue;
      }
      if (e.flash > 0) {
        e.flash -= dt;
        e.mesh.material.emissive = new THREE.Color(e.flash > 0 ? 0xffffff : 0x000000);
      }
    }
  }

  // 渲染对方玩家
  if (remotePlayer) {
    remotePlayer.mesh.position.x = remotePlayer.x;
    remotePlayer.mesh.position.z = remotePlayer.z;
    remotePlayer.mesh.rotation.y = remotePlayer.yaw;
  }
}

// ===== 游戏循环 =====
let lastTime = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  renderer.render(scene, camera);
  if (running) requestAnimationFrame(loop);
}

function gameOver() {
  running = false;
  sfx.gameover();
  stopMusic();
  if (netTimer) { clearInterval(netTimer); netTimer = null; }
  const ov = document.getElementById('overlay');
  ov.style.display = 'flex';
  ov.querySelector('h1').textContent = '💀 战斗结束';
  ov.querySelector('h1').style.color = '#f85149';
  ov.querySelector('#menu-best').textContent = '本局得分：' + score + '　|　最高分：' + best;
  ov.querySelector('#menu-sub').textContent = '再接再厉！';
  ov.querySelector('#btn-single').textContent = '再来一局';
}
// ===== 联机 =====
let netMode = 'single'; // single | host | guest
let peer = null, conn = null, roomId = null;
let remotePlayer = null;

function spawnRemotePlayer(color) {
  if (remotePlayer) { scene.remove(remotePlayer.mesh); remotePlayer = null; }
  const geo = new THREE.BoxGeometry(0.6, 1.8, 0.6);
  const mat = new THREE.MeshLambertMaterial({ color });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(0, 0.9, -5);
  scene.add(mesh);
  remotePlayer = { mesh, x: 0, z: -5, yaw: 0 };
}

function sendState() {
  if (conn && conn.open) conn.send({ type: 'state', x: camera.position.x, z: camera.position.z, yaw, pitch });
}
function broadcastWorld() {
  if (!conn || !conn.open || netMode !== 'host') return;
  const list = enemies.map(e => ({ id: e.id, x: e.mesh.position.x, z: e.mesh.position.z, hp: e.hp, color: e.color }));
  conn.send({ type: 'world', enemies: list, score, hostX: camera.position.x, hostZ: camera.position.z, hostYaw: yaw });
}
function syncEnemies(list) {
  const ids = new Set(list.map(e => e.id));
  for (let i = enemies.length - 1; i >= 0; i--) {
    if (!ids.has(enemies[i].id)) { scene.remove(enemies[i].mesh); enemies.splice(i, 1); }
  }
  for (const d of list) {
    let e = enemies.find(x => x.id === d.id);
    if (!e) {
      const geo = new THREE.BoxGeometry(0.8, 1.8, 0.8);
      const mat = new THREE.MeshLambertMaterial({ color: d.color });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(d.x, 0.9, d.z);
      mesh.castShadow = true;
      scene.add(mesh);
      e = { id: d.id, mesh, hp: d.hp, maxHp: 3, speed: 0, score: 10, color: d.color, r: 0.6, flash: 0, dead: false, baseY: 0.9 };
      mesh.userData.enemy = e;
      enemies.push(e);
    } else {
      e.mesh.position.x = d.x; e.mesh.position.z = d.z; e.hp = d.hp;
    }
  }
}
function guestShoot(d) {
  const pos = new THREE.Vector3(d.x, 1.7, d.z);
  const base = new THREE.Vector3(d.dx, d.dy, d.dz);
  const pellets = d.pellets || 1, spread = d.spread || 0;
  for (let i = 0; i < pellets; i++) {
    const dir = base.clone();
    if (spread > 0) {
      dir.x += (Math.random() - 0.5) * spread * 2;
      dir.y += (Math.random() - 0.5) * spread * 2;
      dir.z += (Math.random() - 0.5) * spread * 2;
      dir.normalize();
    }
    const rc = new THREE.Raycaster(pos, dir, 0, 100);
    const hits = rc.intersectObjects(enemies.map(e => e.mesh), false);
    if (hits.length > 0) {
      const e = hits[0].object.userData.enemy;
      if (e && !e.dead) { hitEnemy(e, d.dmg); break; }
    }
  }
}
function onMessage(data) {
  if (!data) return;
  if (data.type === 'state' && remotePlayer) {
    remotePlayer.x = data.x; remotePlayer.z = data.z; remotePlayer.yaw = data.yaw;
  } else if (data.type === 'world') {
    syncEnemies(data.enemies);
    score = data.score;
    if (remotePlayer) { remotePlayer.x = data.hostX; remotePlayer.z = data.hostZ; remotePlayer.yaw = data.hostYaw; }
    updateHUD();
  } else if (data.type === 'shoot') {
    guestShoot(data);
  } else if (data.type === 'damage') {
    damagePlayer(data.amt);
  }
}

function createRoom() {
  netMode = 'host';
  const info = document.getElementById('room-info');
  info.style.display = 'block';
  info.textContent = '正在创建房间...';
  peer = new Peer();
  peer.on('open', id => {
    roomId = id;
    info.textContent = '房间码：' + id + '（发给朋友加入）';
  });
  peer.on('connection', c => {
    conn = c;
    conn.on('open', () => { startGame(); });
    conn.on('data', onMessage);
    conn.on('close', () => { alert('对方已离开'); location.reload(); });
  });
  peer.on('error', err => {
    info.textContent = '创建失败：' + (err.type || err);
  });
}
function joinRoom(code) {
  netMode = 'guest';
  const info = document.getElementById('room-info');
  info.style.display = 'block';
  info.textContent = '正在连接...';
  peer = new Peer();
  peer.on('open', () => {
    conn = peer.connect(code, { reliable: true });
    conn.on('open', () => { info.textContent = '已连接！'; startGame(); });
    conn.on('data', onMessage);
    conn.on('close', () => { alert('连接已断开'); location.reload(); });
  });
  peer.on('error', err => {
    info.textContent = '连接失败：' + (err.type || err) + '（请检查房间码）';
  });
}

// 联机同步循环
let netTimer = null;
function startNetLoop() {
  if (netTimer) clearInterval(netTimer);
  netTimer = setInterval(() => {
    if (!running) return;
    if (netMode === 'host') broadcastWorld();
    else if (netMode === 'guest') sendState();
  }, 50);
}

// ===== 输入 =====
const cvs = renderer.domElement;

// 键盘
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (!running) return;
  if (k >= '1' && k <= '5') switchWeapon(+k - 1);
  if (k === 'r') startReload();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// 鼠标(pointer lock 转视角 + 射击)
cvs.addEventListener('click', () => { if (running) cvs.requestPointerLock && cvs.requestPointerLock(); });
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement === cvs) {
    yaw -= e.movementX * 0.0022;
    pitch -= e.movementY * 0.0022;
    pitch = clamp(pitch, -1.4, 1.4);
    applyView();
  }
});
document.addEventListener('mousedown', e => { if (e.button === 0 && running) mouseDown = true; });
document.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });

// 触屏:右半屏拖动转视角
let viewId = null, lastTX = 0, lastTY = 0;
cvs.addEventListener('touchstart', e => {
  for (const t of e.touches) {
    if (viewId === null) {
      viewId = t.identifier; lastTX = t.clientX; lastTY = t.clientY;
    }
  }
}, { passive: true });
cvs.addEventListener('touchmove', e => {
  for (const t of e.touches) {
    if (t.identifier === viewId) {
      const g = toGameVec(t.clientX - lastTX, t.clientY - lastTY);
      yaw -= g.x * 0.005;
      pitch -= g.y * 0.005;
      pitch = clamp(pitch, -1.4, 1.4);
      applyView();
      lastTX = t.clientX; lastTY = t.clientY;
    }
  }
}, { passive: true });
cvs.addEventListener('touchend', e => {
  for (const t of e.changedTouches) if (t.identifier === viewId) viewId = null;
});

// 虚拟摇杆
const joystick = document.getElementById('joystick');
const knob = document.getElementById('knob');
const fireBtn = document.getElementById('fire');
let joyId = null;
function handleJoy(cx, cy) {
  const r = joystick.getBoundingClientRect();
  const cx0 = r.left + r.width / 2, cy0 = r.top + r.height / 2;
  let dx = cx - cx0, dy = cy - cy0;
  const max = r.width / 2 - 8;
  const d = Math.hypot(dx, dy);
  if (d > max) { dx = dx / d * max; dy = dy / d * max; }
  knob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
  const g = toGameVec(dx / max, dy / max);
  joyX = g.x; joyY = g.y;
}
function resetJoy() {
  knob.style.transform = 'translate(-50%,-50%)';
  joyX = 0; joyY = 0;
}
joystick.addEventListener('pointerdown', e => { joyId = e.pointerId; joystick.setPointerCapture(e.pointerId); handleJoy(e.clientX, e.clientY); });
joystick.addEventListener('pointermove', e => { if (e.pointerId === joyId) handleJoy(e.clientX, e.clientY); });
function joyEnd(e) { if (e.pointerId === joyId) { joyId = null; resetJoy(); } }
joystick.addEventListener('pointerup', joyEnd);
joystick.addEventListener('pointercancel', joyEnd);

// 射击按钮
fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); joyFire = true; });
window.addEventListener('pointerup', () => { joyFire = false; });
window.addEventListener('pointercancel', () => { joyFire = false; });

// ===== 菜单 / 初始化 =====
const overlay = document.getElementById('overlay');
const tipEl = document.getElementById('menu-tip');
function showMenu() {
  overlay.style.display = 'flex';
  overlay.querySelector('h1').textContent = '🔫 3D 第一人称战场';
  overlay.querySelector('h1').style.color = '#7fd66b';
  overlay.querySelector('#menu-best').textContent = '🏆 最高分 ' + best;
  overlay.querySelector('#menu-sub').textContent = '消灭敌人，别被打死！第一人称射击';
  overlay.querySelector('#btn-single').textContent = '开始游戏';
  tipEl.innerHTML =
    '📱 <b>手机</b>：左下摇杆移动 · 右半屏拖动转视角 · 右下按钮射击<br>' +
    '⌨️ <b>电脑</b>：WASD 移动 · 点击锁定鼠标转视角 · 左键射击<br>' +
    '🔫 换枪 1-5 · 🔁 换弹 R（统一 2 秒）<br>' +
    '🌐 <b>联机</b>：创建房间生成房间码，朋友输入房间码即可加入对战';
}
function startGame() {
  hp = 100; score = 0; weaponIdx = 0; ammo = WEAPONS[0].mag;
  reloading = false; nextShot = 0; spawnTimer = 1.0;
  yaw = 0; pitch = 0;
  camera.position.set(0, 1.7, 0);
  applyView();
  for (const e of enemies) scene.remove(e.mesh);
  enemies.length = 0;
  genObstacles();
  // 联机:对方玩家
  if (netMode === 'host') spawnRemotePlayer(0x5cd36b);
  else if (netMode === 'guest') spawnRemotePlayer(0x4da6ff);
  else remotePlayer = null;
  running = true;
  lastTime = performance.now();
  buildWeaponUI();
  updateHUD();
  audio();
  startMusic();
  startNetLoop();
  requestAnimationFrame(loop);
}
document.getElementById('btn-single').addEventListener('click', () => {
  netMode = 'single';
  overlay.style.display = 'none';
  startGame();
});
document.getElementById('btn-host').addEventListener('click', () => {
  createRoom();
});
document.getElementById('btn-join').addEventListener('click', () => {
  const code = document.getElementById('room-input').value.trim();
  if (code) joinRoom(code);
});

// 初始渲染
genObstacles();
buildWeaponUI();
updateHUD();
showMenu();
renderer.render(scene, camera);
</script>
